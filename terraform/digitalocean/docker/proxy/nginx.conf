client_max_body_size 20M;

upstream apitest {
  server backend-v2:8080;
}

# HTTP forward to HTTPS
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  server_name apitest.shopsinhvien.io.vn;
  ssl_certificate /etc/tls/apitest.shopsinhvien.io.vn/fullchain.pem;
  ssl_certificate_key /etc/tls/apitest.shopsinhvien.io.vn/privkey.pem;
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass     http://apitest;
    proxy_redirect http://apitest https://apitest.shopsinhvien.io.vn;
  }
}

server {
  listen 443 ssl;
  server_name test.shopsinhvien.io.vn;
  ssl_certificate /etc/tls/test.shopsinhvien.io.vn/fullchain.pem;
  ssl_certificate_key /etc/tls/test.shopsinhvien.io.vn/privkey.pem;
  root /usr/share/nginx/html;
  try_files $uri /index.html;
  location / {
    try_files $uri /index.html;
  }
  location ~* \.(?:manifest|appcache|html?|xml|json)$ {
    expires -1;
    access_log off;
  }
  location ~* \.(?:css|js|woff2?|eot|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public";
  }
}
